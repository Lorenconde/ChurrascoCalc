<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Churrasco</title>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="css/styles.css">
    

</head>
<body>
    <div class="container">
        <h1>Calculadora de Churrasco</h1>
        <form id="churrascoForm">
            <div class="input-group">
                <label for="homens">Homens:</label>
                <input type="number" id="homens" name="homens">
            </div>
            <div class="input-group">
                <label for="mulheres">Mulheres:</label>
                <input type="number" id="mulheres" name="mulheres">
            </div>
            <div class="input-group">
                <label for="criancas">Crianças:</label>
                <input type="number" id="criancas" name="criancas">
            </div>
            <button type="button" onclick="calcular()">Calcular</button>
        </form>
        <div id="resultado"></div>
    </div>

   </body>
</html>

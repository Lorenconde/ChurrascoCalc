<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChurrascoCalc</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

<main class="container">
 <header class="header">
  <h1>🔥 ChurrascoCalc</h1>
  <button id="toggleTema">🌙 Alternar tema</button>

</header>

<section class="form-area">

 <div class="input-group">
 <label>Adultos</label>
 <input type="number" id="adultos" placeholder="Digite quantidade"></br>
 </div>

<div class="input-group">
 <label>Crianças</label>
 <input type="number" id="criancas" placeholder="Digite quantidade"></br>
</div>

<h2>Selecione as carnes</h2></br>

<div class="checkbox-group">
 <label><input type="checkbox" value="Picanha" checked>Picanha</label>
 <label><input type="checkbox" value="Linguiça" checked>Linguiça</label>
 <label><input type="checkbox" value="Frango">Frango</label>
 <label><input type="checkbox" value="Costela">Costela</label></br>
</div>

<button id="btnCalcular">Calcular churrasco</button>
<button id="btnSalvar">Salvar lista</button>

</section>


<section id="resultado">
   Resultado aparecerá aqui
</section>

 <footer>
      <p>Desenvolvido por LECR</p>
 </footer>

</main>
 <script src="assets/js/script.js"></script>

</body>
</html>
